<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intruder Log</title>
    <link rel="icon" href="/static/favicon.ico">
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: #e6e6fa;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .topnav {
            background-color: #191970;
            padding: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: white;
            margin: 0;
        }

        h2 {
            color: #191970;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        img {
            width: 150px;
            height: auto;
            border-radius: 5px;
            box-shadow: 1px 1px 6px rgba(0,0,0,0.2);
        }

        .back-button {
            margin-top: 30px;
            background-color: #191970;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            background-color: #3f51b5;
        }

        .no-entry {
            font-size: 20px;
            color: #444;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="topnav">
        <h1>Intruder Log</h1>
    </div>

    <div class="container">
        {% if intruders %}
            <h2>Detected Intruders</h2>
            <table>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Detected At</th>
                </tr>
                {% for intruder in intruders %}
                <tr>
                    <td>{{ intruder.id }}</td>
                    <td><img src="{{ intruder.lastpicture }}" alt="Intruder Image"></td>
                    <td>{{ intruder.time_detected.strftime("%B %d, %Y – %I:%M %p") }}</td>
                </tr>
                {% endfor %}
            </table>
        {% else %}
            <div class="no-entry">🚫 No intruder records found.</div>
        {% endif %}

        <a href="/admin_panel" class="back-button">← Back to Admin Panel</a>
    </div>
</body>
</html>
